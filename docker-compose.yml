services:
  phoenix:
    build:
      dockerfile: ./Dockerfile
      context: .
    depends_on:
      - db
    ports:
      - 6006:6006
      - 4317:4317
    env_file:
      - .env
    environment:
      - PHOENIX_SQL_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
  db:
    image: postgres
    restart: always
    env_file:
      - .env
    ports:
      - ${POSTGRES_PORT}
    volumes:
      - database_data:/var/lib/postgresql/data
volumes:
  database_data:
    driver: local
